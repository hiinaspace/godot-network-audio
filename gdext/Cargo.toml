[package]
name = "godot_network_audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
iroh-transport = ["dep:godot_network_audio_iroh", "dep:bytes", "dep:iroh", "dep:iroh-base", "dep:tokio"]

[dependencies]
anyhow.workspace = true
bytes = { workspace = true, optional = true }
crossbeam-queue.workspace = true
godot.workspace = true
iroh = { workspace = true, optional = true }
iroh-base = { workspace = true, optional = true }
godot_network_audio_iroh = { path = "../iroh-sidecar", optional = true }
tokio = { workspace = true, optional = true }
voice-core = { path = "../voice-core" }
