[workspace]
members = [
    "codec-bench",
    "voice-core",
    "voice-mesh-bench",
    "gdext",
    "iroh-sidecar",
    "gdext-iroh",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
audiopus = "0.3.0-rc.0"
bytes = "1.11"
crossbeam-queue = "0.3.12"
godot = { version = "0.5.5", features = ["api-4-7", "experimental-threads"] }
hound = "3.5.1"
iroh = "1.1.0"
iroh-base = "1.1.0"
libc = "0.2"
neteq = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.17"
# Iroh's hickory/noq graph enables tinyvec's alloc support without std;
# tinyvec 1.13 currently misses vec! in that configuration.
tinyvec = { version = "1.13", features = ["std"] }
tokio = { version = "1.44.1", features = ["rt-multi-thread", "sync", "time"] }
web-time = "1.1.0"

[patch.crates-io]
neteq = { git = "https://github.com/hiinaspace/videocall-rs.git", rev = "69c6ccb08afe56d0d1b1cd9e5a7de011679fa152" }
