[workspace]
members = ["voice-core", "gdext", "iroh-sidecar", "gdext-iroh"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
audiopus = "0.3.0-rc.0"
bytes = "1.11"
crossbeam-queue = "0.3.12"
godot = { version = "0.5.0", features = ["api-4-6", "experimental-threads"] }
hound = "3.5.1"
iroh = "0.97.0"
iroh-base = "0.97.0"
neteq = "=0.8.3"
thiserror = "2.0.17"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "sync", "time"] }
web-time = "1.1.0"

[patch.crates-io]
neteq = { path = "../../lib/videocall-rs/neteq" }
